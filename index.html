<!doctype html>
<html lang="pt-BR">
<head>

<title>O Público Decide: Carlos em 7 dias</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4CC;--fg:#1B2A4A;--card:#ffffff;--line:#1B2A4A;--yel:#FFD521;--blue:#5BC0EB;--ink:#1B2A4A;--u:min(1vw,1.7vh);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B2A4A;--fg:#FFF4CC;--card:#26385e;--line:#FFD521}}
:root[data-theme="dark"]{--bg:#1B2A4A;--fg:#FFF4CC;--card:#26385e;--line:#FFD521}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Nunito',system-ui,sans-serif;font-weight:600}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:calc(var(--u)*1.6) calc(var(--u)*3);gap:calc(var(--u)*1.4);box-sizing:border-box}
.disp{font-family:'Lilita One',Impact,sans-serif;font-weight:400}
.top{display:flex;align-items:center;gap:calc(var(--u)*2)}
.pill{background:var(--yel);color:var(--ink);padding:.3em .9em;border-radius:99px;font-size:calc(var(--u)*1.8);letter-spacing:.12em;white-space:nowrap}
.xp{flex:1;display:flex;align-items:center;gap:calc(var(--u)*1.2);font-size:calc(var(--u)*1.8);font-weight:800}
.track{flex:1;height:calc(var(--u)*2.2);border:3px solid var(--line);border-radius:99px;background:var(--card);overflow:hidden}
#fill{height:100%;background:var(--blue);transition:width .9s ease}
main{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*2);min-height:0}
h1{margin:0;font-size:calc(var(--u)*7.5);line-height:1}
h2{margin:0;font-size:calc(var(--u)*2.4);letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.big{font-size:calc(var(--u)*2.6);line-height:1.3;max-width:70em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*2)}
.card{background:var(--card);border:4px solid var(--line);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2);display:flex;flex-direction:column;gap:calc(var(--u)*1)}
.letter{align-self:flex-start;background:var(--yel);color:var(--ink);font-size:calc(var(--u)*3.2);border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center}
.lab{font-size:calc(var(--u)*3);font-weight:800;line-height:1.1}
.prod{font-size:calc(var(--u)*1.8)}
.cnt{font-size:calc(var(--u)*9);line-height:1}
.ctl{display:flex;gap:calc(var(--u)*1.5)}
button{font:inherit;font-weight:800;min-height:44px;min-width:44px;cursor:pointer;border:3px solid var(--line);border-radius:calc(var(--u)*1.2);background:var(--card);color:var(--fg);padding:.4em 1em;font-size:calc(var(--u)*1.9)}
button:hover{background:var(--yel);color:var(--ink)}
.ctl button{flex:1;font-size:calc(var(--u)*3)}
.win{background:var(--yel);color:var(--ink);border-color:var(--ink)}
.chip{align-self:flex-start;background:var(--blue);color:var(--ink);border-radius:99px;padding:.2em .9em;font-size:calc(var(--u)*3);font-weight:800}
.row{display:flex;gap:calc(var(--u)*2);flex-wrap:wrap;align-items:stretch}
.row>.card{flex:1;min-width:30%}
.foot{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*2);font-size:calc(var(--u)*1.5)}
.keys{opacity:.85}
.btns{display:flex;gap:calc(var(--u)*1)}
@media (max-width:700px){.grid{grid-template-columns:1fr}.foot{flex-direction:column}}
.cs{cursor:pointer;-webkit-tap-highlight-color:transparent}.cs .m2{display:none}.cs.talk .m2{display:inline}.cs.talk .m1{display:none}
.cb{animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(-4px)}}
.cj.jump{animation:jump .7s ease-out}@keyframes jump{30%{transform:translateY(-60px)}60%{transform:translateY(0)}80%{transform:translateY(-14px)}}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.5s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.armL,.armR{transform-box:fill-box;transform-origin:50% 0}
.cs:hover .armR{animation:wave .7s ease-in-out infinite alternate}@keyframes wave{from{transform:rotate(-100deg)}to{transform:rotate(-135deg)}}
.note{opacity:0}.cs:hover .note{animation:rise 1.8s infinite}.cs:hover .n2{animation-delay:.9s}@keyframes rise{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.bubble{align-self:center;background:var(--yel);color:var(--ink);border:3px solid var(--line);border-radius:calc(var(--u)*2);padding:.2em .9em;font-weight:800}
@media (prefers-reduced-motion:reduce){.cs *{animation:none!important}}
.track{height:calc(var(--u)*3)}#fill{background:repeating-linear-gradient(135deg,#5BC0EB 0 16px,#8FD8F6 16px 32px)}
.xp .pill{font-size:calc(var(--u)*2)}
.cs .m0,.cs .b2,.cs .sw{display:none}.cs.conf .m0,.cs.conf .b2,.cs.conf .sw{display:inline}.cs.conf .m1,.cs.conf .b1,.cs.conf.talk .m0{display:none}.cs.conf.talk .m1{display:none}
.cs.over .scp{display:none}.cs .sco{display:none}.cs.over .sco{display:inline}
.cons:hover .btn{animation:press .4s infinite alternate}@keyframes press{to{transform:translateY(2px);opacity:.5}}
.cs:hover .fr{display:none}.cs.happy .armR{animation:wave .7s ease-in-out infinite alternate}.cs.happy .note{animation:rise 1.8s infinite}
.q{transform-box:fill-box;transform-origin:50% 100%;animation:wob 2.4s ease-in-out infinite}.q2{animation-delay:.4s}.q3{animation-delay:.9s}@keyframes wob{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) translateY(-10px) scale(1.14)}}.cs:hover .q{animation-duration:.6s}
.two{display:flex;align-items:center;gap:calc(var(--u)*3);flex:1;min-height:0}.two svg{flex:0 0 42%;height:100%;max-height:100%}.col{display:flex;flex-direction:column;gap:calc(var(--u)*2);flex:1}
.row2{display:flex;gap:calc(var(--u)*2)}.bg{font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:calc(var(--u)*5);padding:.3em 1.4em;border-radius:calc(var(--u)*2)}.bg.yes{background:var(--yel);color:var(--ink)}
main{align-items:center;text-align:center}
main>.grid,main>.row{width:100%}
main>.big{margin-inline:auto}
.card{align-items:center;text-align:center;justify-content:center}
.letter{align-self:center}
.chip{align-self:center}
.ctl{width:100%}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:9em;line-height:1;padding:.5em 1em;box-sizing:border-box;text-indent:.12em}
.xp .pill{min-width:4.5em}
.xp span{white-space:nowrap}
#pct{min-width:3ch;text-align:right}
h2{text-indent:.1em}
.two{width:100%}
.two .col{align-items:flex-start;text-align:left}
.endcard{align-items:flex-start;text-align:left}
</style>
</head>
<body>
<div id="app">
<div class="top"><div class="pill disp" id="day">EPISÓDIO 0</div><div class="xp"><span>Episódio</span><div class="track"><div id="fill" style="width:0%"></div></div><span id="pct">0%</span><span class="pill disp" id="xpn">0 XP</span></div></div>
<main id="main"></main>
<div class="foot"><div class="keys">A · B · C = +1 voto &nbsp;|&nbsp; Shift + tecla = −1 &nbsp;|&nbsp; Enter ou Espaço = avançar &nbsp;|&nbsp; Backspace = voltar</div><div class="btns"><button data-a="full">Tela cheia</button><button data-a="reset">Reiniciar</button><button data-a="back">◀ Voltar</button><button data-a="next">Avançar ▶</button></div></div>
</div>
<script>
const DAYS=[
{t:"Equipamento",q:"O que o Carlos compra primeiro?",o:[
{l:"Trocar de PC",p:"PC topo de linha",x:15,g:"O PC chega e o Carlos descobre que não tem mesa para o monitor."},
{l:"Mouse e teclado novos",p:"Periféricos",x:8,g:"Agora ele erra, mas com muito mais precisão."},
{l:"Cadeira gamer",p:"Cadeira gamer",x:5,g:"Super confortável. Perdeu do mesmo jeito, só que sentado."}]},
{t:"Jogo novo",q:"Qual jogo o Carlos vai treinar?",o:[
{l:"O lançamento do momento",p:"Jogo digital",x:12,g:"Joga seis horas seguidas e finalmente entende o tutorial."},
{l:"Um clássico retrô",p:"Jogo retrô",x:10,g:"O Barão 8-Bit aparece, dá dicas e humilha o Carlos."},
{l:"Um jogo cooperativo",p:"Jogo cooperativo",x:14,g:"O amigo carrega o time, mas o Carlos aprende a pedir ajuda."}]},
{t:"Estratégia",q:"Como o Carlos treina a cabeça?",o:[
{l:"Tabuleiro de estratégia",p:"Jogo de tabuleiro",x:12,g:"Descobre que existe vida além do ataque direto."},
{l:"Jogo de cartas",p:"Jogo de cartas",x:8,g:"Aprendeu a blefar. Só não aprendeu a esconder o sorriso."},
{l:"Cooperativo contra a Mãe",p:"Tabuleiro cooperativo",x:10,g:"A Mãe vence em 4 minutos. O Carlos pede revanche."}]},
{t:"Coleção e moral",q:"O que o Carlos compra agora?",o:[
{l:"Um boneco da coleção para a namorada",p:"Funko Pop",x:5,g:"A namorada ama e a moral dele explode, mas ele passou a tarde na estante e esqueceu de treinar."},
{l:"Um Lego para treinar a paciência",p:"Lego",x:9,g:"Monta 1.200 peças e, enfim, aprende paciência."},
{l:"Um Funko mascote da sorte",p:"Funko Pop",x:3,g:"O mascote não ajudou em nada, mas ficou lindo no setup."}]},
{t:"RPG",q:"Em que mesa o Carlos senta?",o:[
{l:"Mestre calmo",p:"RPG de mesa",x:12,g:"Sobrevive à taverna e já se acha herói."},
{l:"Mestre implacável",p:"RPG de mesa",x:6,g:"Morre na primeira sala e culpa o dado."},
{l:"Dados da sorte",p:"Dados de RPG",x:2,g:"Tira 1 três vezes seguidas e jura que o dado está viciado."}]},
{t:"Tech final",q:"Qual upgrade fecha o treino?",o:[
{l:"Headset surround",p:"Headset",x:10,g:"Ouve os passos do inimigo bem na hora em que morre."},
{l:"Monitor de alta taxa",p:"Monitor",x:12,g:"Finalmente vê os inimigos. E percebe que eram muitos."},
{l:"Controle profissional",p:"Controle",x:8,g:"O controle é ótimo. O Carlos ainda aperta o botão errado."}]}];
const BOSS={t:"Chefão final",q:"Quem o Carlos enfrenta?",o:[
{l:"Barão 8-Bit",p:"O Guardião do Cartucho Sagrado",g:"Joga desde o tempo em que o save era anotado no caderno.",r:[
{t:"Rodada 1",q:"O cartucho não liga. E agora?",o:[{l:"Soprar o cartucho",pt:2,g:"Funciona desde 1992. O Barão aprova com um aceno."},{l:"Bater no console",pt:1,g:"Liga, mas o Barão cruza os braços."},{l:"Culpar o lag",pt:0,g:"Console retrô não tem lag. Tem caráter."}]},
{t:"Rodada 2",q:"Chefe de fase, sem checkpoint.",o:[{l:"Decorar o padrão do chefe",pt:2,g:"Dez tentativas depois, o chefe cai."},{l:"Apertar todos os botões",pt:1,g:"Quase deu certo. Ninguém sabe como."},{l:"Pedir pausa",pt:0,g:"O Barão: pausa na vida não existe."}]},
{t:"Rodada 3",q:"O código secreto da fase final.",o:[{l:"Cima, cima, baixo, baixo…",pt:2,g:"Código perfeito. O Barão quase chora."},{l:"Esquerda, direita, A",pt:1,g:"Abriu uma fase que ninguém conhecia."},{l:"Digitar o próprio nome",pt:0,g:"Nada acontece. Só o Barão ri."}]}]},
{l:"Madame Xeque-Mate",p:"A Rainha Invicta do Tabuleiro",g:"Nunca perdeu uma partida. Nem de dominó, nem de vida.",r:[
{t:"Rodada 1",q:"Primeiro turno do jogo.",o:[{l:"Montar a defesa",pt:2,g:"Ela esperava um ataque. Primeiro ponto do Carlos."},{l:"Atacar de cara",pt:1,g:"Ela sorri. Estava tudo planejado."},{l:"Mudar as regras",pt:0,g:"Ela já leu o manual inteiro. Duas vezes."}]},
{t:"Rodada 2",q:"Ela oferece uma troca suspeita.",o:[{l:"Recusar com um sorriso",pt:2,g:"Madame Xeque-Mate ergue a sobrancelha. Respeito."},{l:"Propor outra troca",pt:1,g:"Negociou bem, mas perdeu um recurso."},{l:"Aceitar na hora",pt:0,g:"Era uma armadilha. Claro que era."}]},
{t:"Rodada 3",q:"Última carta da partida.",o:[{l:"Blefar com cara de paisagem",pt:2,g:"Ela caiu! Ninguém acredita."},{l:"Jogar a carta mais forte",pt:1,g:"Funcionou, mas ela já esperava."},{l:"Mostrar a mão sem querer",pt:0,g:"Ela agradece a gentileza e vence em dois turnos."}]}]},
{l:"Lady D20",p:"A Senhora dos Dados Malditos",g:"Narra com voz de trovão e rola dado como quem decide o destino.",r:[
{t:"Rodada 1",q:"Emboscada na taverna.",o:[{l:"Conversar com o taverneiro",pt:2,g:"Ganhou uma pista e um caldo quente."},{l:"Pedir uma rodada de suco",pt:1,g:"Todo mundo achou fofo. Ninguém ajudou."},{l:"Chutar a porta",pt:0,g:"Era a porta do banheiro."}]},
{t:"Rodada 2",q:"O dragão acorda.",o:[{l:"Negociar com o dragão",pt:2,g:"O dragão aceita um acordo. Lady D20 suspira."},{l:"Atacar com o que tiver",pt:1,g:"Uma colher de pau causa 1 de dano."},{l:"Fingir de morto",pt:0,g:"O dragão adorou. Churrasco."}]},
{t:"Rodada 3",q:"O teste de sorte final.",o:[{l:"Rolar o dado com confiança",pt:2,g:"Um 20 natural! A sala vai à loucura."},{l:"Beijar o dado antes",pt:1,g:"Deu 11. Ao menos o dado ficou limpo."},{l:"Culpar o dado antes de rolar",pt:0,g:"Deu 1. Ele já tinha reclamado."}]}]}]};

DAYS.forEach((d,n)=>steps.push({k:"vote",d:n},{k:"res",d:n}));
steps.push({k:"bvote"},{k:"bintro"});
[0,1,2].forEach(n=>steps.push({k:"rvote",n},{k:"rres",n}));
steps.push({k:"bend"},{k:"final"},{k:"cta"},{k:"thanks"});
let i=0;const V={},R={r:[]};
const $=s=>document.querySelector(s);const L="ABC";
function xpAt(n){let s=0;steps.forEach((st,j)=>{if(st.k==="res"&&j<=n&&R[st.d])s+=R[st.d].o.x});return Math.max(0,Math.min(100,s))}
function votes(){return V[i]||(V[i]=[0,0,0])}
function decide(src){const v=votes();const m=Math.max(...v);const c=v.map((x,k)=>x===m?k:-1).filter(k=>k>=0);const k=c[Math.floor(Math.random()*c.length)];return{o:src.o[k],k,tie:c.length>1}}
function cards(src){return `<div class="grid">${src.o.map((o,k)=>`<div class="card"><div class="letter disp">${L[k]}</div><div class="lab">${o.l}</div><div class="prod">${o.p||""}</div><div class="cnt disp">${votes()[k]}</div><div class="ctl"><button data-a="m${k}" aria-label="Tirar voto ${L[k]}">−</button><button data-a="p${k}" aria-label="Somar voto ${L[k]}">+</button></div></div>`).join("")}</div>`}
function rc(r,head,sub,chip){return `<h2>${head}${r.tie?" · empate, sorteado!":""}</h2><div class="card win"><div class="lab disp" style="font-size:calc(var(--u)*6)">${r.o.l}</div>${sub?`<div class="prod">${sub}</div>`:""}<div class="big">“${r.o.g}”</div>${chip?`<div class="chip">${chip}</div>`:""}</div>`}

circle cx="426" cy="496" r="15" fill="#fff"/><circle cx="474" cy="496" r="15" fill="#fff"/><g id="pup"><circle cx="426" cy="497" r="6.5" fill="#1B2A4A" stroke="none"/><circle cx="474" cy="497" r="6.5" fill="#1B2A4A" stroke="none"/><circle cx="429" cy="494" r="2" fill="#fff" stroke="none"/><circle cx="477" cy="494" r="2" fill="#fff" stroke="none"/></g></g><path class="b1" d="M410 472Q426 466 442 472M458 472Q474 466 490 472" fill="none" stroke-width="4"/><path class="b2" d="M410 466Q426 462 442 474M458 468Q474 458 490 464" fill="none" stroke-width="4"/><path d="M450 502Q442 520 453 522" fill="none" stroke-width="3"/><path d="M400 538Q400 570 450 574Q500 570 500 538Q480 560 450 560Q420 560 400 538Z" fill="#6B4630"/><path d="M430 534Q440 528 450 533Q460 528 470 534Q460 540 450 538Q440 540 430 534Z" fill="#6B4630" stroke-width="3"/><path class="m1" d="M438 549Q450 558 462 549" fill="none" stroke="#7A1F1F" stroke-width="4"/><path class="m0" d="M436 553Q443 546 450 553T464 553" fill="none" stroke="#7A1F1F" stroke-width="4"/><path class="m2" d="M439 547Q450 566 461 547Z" fill="#7A1F1F" stroke="#5a1515" stroke-width="3"/><path class="sw" d="M522 452Q530 466 522 472Q514 466 522 452Z" fill="#8FD8F6" stroke-width="2"/><path d="M384 488Q380 408 450 406Q520 408 516 488" fill="none" stroke-width="14"/><path d="M384 488Q380 408 450 406Q520 408 516 488" fill="none" stroke="#fff" stroke-width="7"/><rect x="364" y="468" width="32" height="58" rx="14" fill="#fff"/><rect x="504" y="468" width="32" height="58" rx="14" fill="#fff"/><circle cx="380" cy="497" r="7" fill="#dfe6f2" stroke-width="3"/><circle cx="520" cy="497" r="7" fill="#dfe6f2" stroke-width="3"/><path d="M372 524Q378 568 420 574" fill="none"/><circle cx="424" cy="574" r="8" fill="#fff"/></g></g></g><text class="note" x="334" y="470" style="font-size:34px;fill:var(--fg)">♪</text><text class="note n2" x="548" y="450" style="font-size:34px;fill:var(--fg)">♫</text>`}
const TXT=(a,r,sz,f,st)=>`<path id="${a}" d="M${450-r} 520A${r} ${r} 0 0 1 ${450+r} 520"/>`;
function TITLE(){return `<defs>${TXT("arc1",268)}${TXT("arc2",196)}</defs><g style="font-family:'Lilita One',Impact,sans-serif;text-anchor:middle;stroke:var(--fg);stroke-width:10px;paint-order:stroke;stroke-linejoin:round"><text style="fill:#FFD521;font-size:68px;letter-spacing:3px"><textPath href="#arc1" startOffset="50%">O PÚBLICO DECIDE:</textPath></text><text style="fill:#5BC0EB;font-size:56px;letter-spacing:3px"><textPath href="#arc2" startOffset="50%">CARLOS EM 7 DIAS</textPath></text></g>`}
function render(){
const st=steps[i],xp=xpAt(i),m=$("#main"),pc=Math.round(i/(steps.length-1)*100);
$("#fill").style.width=pc+"%";$("#pct").textContent=pc+"%";$("#xpn").textContent=xp+" XP";
let day="EPISÓDIO 0",h="";
if(st.k==="intro"){h=`<svg class="cs conf" viewBox="170 170 560 905" role="img" aria-label="Carlos, confuso, com um console na mão, sob o título O Público Decide: Carlos em 7 dias" style="flex:1 1 0;min-height:0;width:100%">${TITLE()}<circle cx="450" cy="780" r="270" fill="#FFD521" opacity=".35"/>${Q()}${FIG()}</svg><div class="big" id="say" style="text-align:center">O Carlos está perdido… e precisa da <b>SUA</b> ajuda! (clique nele)</div>`}
else if(st.k==="help"){h=`<div class="two"><svg class="cs conf" viewBox="260 360 420 720" role="img" aria-label="Carlos pedindo ajuda">${Q()}${FIG()}</svg><div class="col"><h1 class="disp">VOCÊ QUER AJUDAR O CARLOS?</h1><div class="big" id="say">Ele já tentou sozinho. Não deu muito certo.</div><div class="row2"><button class="bg yes" data-a="yes">SIM!</button><button class="bg" data-a="no">NÃO</button></div></div></div>`}
else if(st.k==="vote"){const d=DAYS[st.d];day="DIA "+(st.d+1)+" DE 7";h=`<h2>${d.t}</h2><h1 class="disp">${d.q}</h1>${cards(d)}`}
else if(st.k==="res"){const r=R[st.d];day="DIA "+(st.d+1)+" DE 7";h=rc(r,"O público decidiu","Produto da loja: "+r.o.p,"+"+r.o.x+" XP")}
else if(st.k==="bvote"){day="CHEFÃO FINAL";h=`<h2>${BOSS.t}</h2><h1 class="disp">${BOSS.q}</h1>${cards(BOSS)}`}
else if(st.k==="bintro"){day="CHEFÃO FINAL";h=rc(R.boss,"O chefão escolhido",R.boss.o.p,"3 rodadas de desafio")}
else if(st.k==="rvote"){const rd=R.boss.o.r[st.n];day="CHEFÃO · RODADA "+(st.n+1)+"/3";h=`<h2>${R.boss.o.l} · ${rd.t}</h2><h1 class="disp">${rd.q}</h1>${cards(rd)}`}
else if(st.k==="rres"){const r=R.r[st.n];day="CHEFÃO · RODADA "+(st.n+1)+"/3";h=rc(r,"O público decidiu","",r.o.pt+(r.o.pt===1?" ponto":" pontos"))}
else if(st.k==="bend"){day="DUELO";const o=outcome(),b=R.boss.o.l;const T={win:["VITÓRIA!","Carlos derrotou "+b+"! Ninguém acredita, nem ele."],close:["EMPATE TÉCNICO","Carlos chegou perto, mas "+b+" sorriu e disse: ainda não."],lose:["DERROTA ÉPICA","Carlos perdeu para "+b+" e reclamou. Mas lutou como nunca."]}[o.k];h=`<h2>Resultado do duelo</h2><h1 class="disp">${T[0]}</h1><div class="big">${T[1]}</div><div class="row"><div class="card"><div class="lab">Rodadas</div><div class="cnt disp">${o.pts}/6</div></div><div class="card"><div class="lab">Bônus do XP</div><div class="cnt disp">+${o.t-o.pts}</div></div><div class="card win"><div class="lab">Total</div><div class="cnt disp">${o.t}/10</div></div></div>`}
else if(st.k==="final"){day="RESULTADO";const v=xp<40?"Melhorou um pouco.":xp<60?"Melhorou de verdade.":"Quase pro player.";h=`<h2>Desafio do Chefão: Dia 0 contra Dia 7</h2><div class="row"><div class="card"><div class="lab">Dia 0</div><div class="cnt disp">0 XP</div></div><div class="card win"><div class="lab">Dia 7</div><div class="cnt disp">${xp} XP</div></div></div><h1 class="disp">${v}</h1><div class="big">“Eu não virei pro player. Mas fiquei bem melhor, e o culpado é de vocês.”</div>`}
else if(st.k==="cta"){day="FIM";h=`<div class="pill disp">PRESS START</div><h1 class="disp">TEM JOGO PRA<br>TODA A FAMÍLIA.</h1><div class="big">Tudo o que o Carlos usou está no site.</div><div class="row"><div class="card win"><div class="lab disp" style="font-weight:900;-webkit-text-stroke:.04em currentColor;letter-spacing:.04em">FGTEEV</div><div class="prod">claude.ai/artifact/235pPNDcLoj3SA3xa6D2do</div></div><div class="card"><div class="lab disp">Cupom CARLOS10</div><div class="prod">10% de desconto</div></div></div>`}
else{day="OBRIGADA!";h=`<div class="two"><svg class="cs happy" viewBox="260 360 420 720" role="img" aria-label="Carlos feliz, acenando">${FIG()}</svg><div class="col"><h1 class="disp">MUITO OBRIGADA POR AJUDAR O CARLOS!</h1><div class="big">Graças a vocês, ele finalmente pode dizer: “agora vai.” Dessa vez, de verdade.</div><h2>Até o próximo episódio</h2><div class="card win endcard"><div class="lab disp" style="font-size:calc(var(--u)*4.2)">Sua próxima aventura começa aqui!</div><div class="big">Explore nossa loja e encontre tudo para entrar no universo gamer.</div></div></div></div>`}
$("#day").textContent=day;m.innerHTML=h;wireCarlos()}
function next(){const st=steps[i];if(i>=steps.length-1)return;
if(st.k==="vote")R[st.d]=decide(DAYS[st.d]);
if(st.k==="bvote")R.boss=decide(BOSS);
if(st.k==="rvote")R.r[st.n]=decide(R.boss.o.r[st.n]);
i++;render()}
function back(){if(i>0){i--;render()}}
function add(k,dl){const st=steps[i];if(st.k!=="vote"&&st.k!=="bvote"&&st.k!=="rvote")return;const v=votes();v[k]=Math.max(0,v[k]+dl);render()}
function no(){const e=$("#say");if(e){e.textContent="Ah, é? Então o Carlos continua perdido… Pensa de novo?";e.classList.add("bubble")}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
if(a==="next"||a==="yes")next();else if(a==="back")back();else if(a==="no")no();
else if(a==="reset"){i=0;for(const k in V)delete V[k];for(const k in R)delete R[k];R.r=[];render()}
else if(a==="full"){try{document.documentElement.requestFullscreen()}catch(x){}}
else add(+a[1],a[0]==="p"?1:-1)});
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase();
if(k==="enter"||k===" "||k==="arrowright"){e.preventDefault();next()}
else if(k==="backspace"||k==="arrowleft"){e.preventDefault();back()}
else if(steps[i].k==="help"&&k==="s")next();else if(steps[i].k==="help"&&k==="n")no();
else if("abc".includes(k)&&k.length===1)add("abc".indexOf(k),e.shiftKey?-1:1)});
const SAY=["Agora vai.","Foi o lag!","Meu PC é que é lento.","Vocês decidem, eu sofro.","O dado está viciado!","Eu treino, tá?","Só mais uma partida."];
let sayI=Math.floor(Math.random()*SAY.length);
function say(t){const el=$("#say");if(el){el.textContent=t;el.classList.add("bubble")}}
function wireCarlos(){const s=$(".cs");if(!s)return;
s.onclick=()=>{const j=$(".cj");j.classList.remove("jump");void j.getBoundingClientRect();j.classList.add("jump");s.classList.add("talk");say("“"+SAY[sayI++%SAY.length]+"”");clearTimeout(wireCarlos.t);wireCarlos.t=setTimeout(()=>s.classList.remove("talk"),1200)};
const c=$(".cons");if(c)c.onclick=e=>{e.stopPropagation();s.classList.add("over");say("“GAME OVER. De novo…”");clearTimeout(wireCarlos.o);wireCarlos.o=setTimeout(()=>s.classList.remove("over"),1800)}}
document.addEventListener("mousemove",e=>{const s=$(".cs");if(!s)return;const r=s.getBoundingClientRect();const c=v=>Math.max(-1,Math.min(1,v));const dx=c((e.clientX-r.left-r.width/2)/r.width*3),dy=c((e.clientY-r.top-r.height*0.4)/r.height*3);
[["pup",4,3],["stk",4,4],["cpup",3,2]].forEach(([id,a,b])=>{const n=document.getElementById(id);if(n)n.setAttribute("transform","translate("+dx*a+" "+dy*b+")")})});
render();
</script>
